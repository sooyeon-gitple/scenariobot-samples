<!DOCTYPE HTML>
<html>
<head>
    <title>Gitple Integration Test</title>
    <style>
        #kakao-launcher {
            z-index: 9999989;
            display: block;
            position: fixed;
            right: 20px;
            bottom: 20px;
        }

        #kakao-launcher-icon {
            cursor: pointer;
            width: 60px;
            height: 60px;
            border-radius: 30px;
            box-shadow: 0px 6px 20px rgba(0, 0, 0, 0.1);
            transition: all 0.12s;
            padding: 0;
            animation: kakao-launcher-appear 0.5s ease;
        }

        #kakao-launcher-custom-icon {
            cursor: pointer;
            transition: all 0.12s;
            padding: 0;
            display: inline;
            max-width: 100%;
            height: auto;
        }

        @keyframes kakao-launcher-appear {
            0% {
                opacity: 0;
                transform: scale(0.5);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @media (max-width: 768px) {
            #kakao-launcher {
                right: 10px;
                bottom: 10px;
            }

            #kakao-launcher-icon {
                width: 50px;
                height: 50px;
                border-radius: 25px;
            }
        }
    </style>
</head>
<body>
<h1>Gitple Integration Test</h1>
<p>Gitple Integration Test Page</p>

<div id="kakao-launcher-input">
  <label for="uuid">UUID: </label>
	<input type="text" data-field="uuid" placeholder="Enter UUID" value="@mdy46rmdota1oo2" />
    <br><br>
		<label for="extra">Extra: </label>
		<br>
    <textarea data-field="extra" placeholder="Enter Extra Data (JSON format)" rows="30" cols="100">{
      "gpType": "sp:7092",
      "gpData": {
        "user": {
          "name": "김통테2",
          "phone": "01087498013",
          "group": "0000000000",
          "userFields": {
            "fcnumber": "0000000000",
            "cnslid": "10000284",
            "aplrdob": "19971013",
            "aplrsxds": "남",
            "inflpath": "direct",
            "inflpathdtl": "보장분석/자녀보장",
            "intro1": "안녕하세요. 삼성생명 다이렉트 채널입니다.",
            "intro2": "https://api.t.drt.samsunglife.k....geAnalysisDirectInfoView",
            "notexistinuserfields": "자원에 없는 키",
            "notexistinuserfields2": "자원에 없는 키2"
          }
        }
      }
    }</textarea>
    <br>
</div>

<script>
    function appendHiddenInput(form, name, value) {
        const hiddenField = document.createElement("input");
        hiddenField.setAttribute("type", "hidden");
        hiddenField.setAttribute("name", name);
        hiddenField.setAttribute("value", value);
        form.appendChild(hiddenField);
    }

    function openKakaotalk() {
        const kakaoForm = document.createElement("form");
        kakaoForm.setAttribute("method", "post");
        kakaoForm.setAttribute("action", "https://bizmessage.kakao.com/chat/open");
        kakaoForm.setAttribute("target", "kakaoView");

        document.querySelectorAll("#kakao-launcher-input [data-field]").forEach(input => {
            if (input.dataset.field === "extra") {
                try {
                    const parsedValue = JSON.parse(input.value);
                    appendHiddenInput(kakaoForm, input.dataset.field, JSON.stringify(parsedValue));
                } catch (error) {
                    console.error("Invalid JSON in Extra Data:", error);
                    return;
                }
            } else {
                appendHiddenInput(kakaoForm, input.dataset.field, input.value);
            }
        });

        document.body.appendChild(kakaoForm);
        kakaoForm.submit();
    }

    function createLauncher() {
        const launcherContainer = document.createElement("div");
        launcherContainer.id = "kakao-launcher";

        const launcherIcon = document.createElement("div");
        launcherIcon.id = "kakao-launcher-icon";

        const customIcon = document.createElement("img");
        customIcon.id = "kakao-launcher-custom-icon";
        customIcon.setAttribute("src", "https://s3.ap-northeast-2.amazonaws.com/www.gitple.io/icon-kakao-talk.png");
        customIcon.setAttribute("srcset", "https://s3.ap-northeast-2.amazonaws.com/www.gitple.io/icon-kakao-talk%402x.png 2x");

        launcherIcon.appendChild(customIcon);
        launcherContainer.appendChild(launcherIcon);

        customIcon.addEventListener("click", openKakaotalk);
        document.body.appendChild(launcherContainer);
    }

    window.addEventListener("load", createLauncher);
</script>
</body>
</html>
